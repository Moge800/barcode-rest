name: Release

# GitHubでリリースを作成したときに barcode-rest.exe を自動ビルドして添付する。
# Automatically build and attach barcode-rest.exe when a GitHub Release is created.
on:
  release:
    types: [created]

permissions:
  contents: write  # softprops/action-gh-release がリリースにファイルを添付するために必要
                   # Required for softprops/action-gh-release to upload release assets.

jobs:
  build:
    name: Build barcode-rest (Windows + Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # CGOなしなのでクロスコンパイルで全ターゲットを作れる。
      # AV誤検知を避けるため -H=windowsgui は使わない(コンソール窓は起動時に自前で隠す)。
      - name: Build Windows
        run: GOOS=windows GOARCH=amd64 go build -o barcode-rest.exe .

      - name: Build Linux
        run: GOOS=linux GOARCH=amd64 go build -o barcode-rest-linux-amd64 .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            barcode-rest.exe
            barcode-rest-linux-amd64
