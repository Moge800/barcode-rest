name: Release

# v* タグをpushするとビルドしてGitHub Releaseを自動作成する。
# Pushing a v* tag builds the binaries and creates a GitHub Release.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # CGOなしなのでクロスコンパイルで全ターゲットを作れる。
      # AV誤検知を避けるため -H=windowsgui は使わない(コンソール窓は起動時に自前で隠す)。
      - name: Build (Windows amd64)
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-X barcode-rest/internal/server.Version=${GITHUB_REF_NAME}" -o barcode-rest.exe .

      - name: Build (Linux amd64)
        run: GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-X barcode-rest/internal/server.Version=${GITHUB_REF_NAME}" -o barcode-rest-linux-amd64 .

      - name: Build (Linux arm64)
        run: GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-X barcode-rest/internal/server.Version=${GITHUB_REF_NAME}" -o barcode-rest-linux-arm64 .

      - name: Build (macOS amd64)
        run: GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-X barcode-rest/internal/server.Version=${GITHUB_REF_NAME}" -o barcode-rest-darwin-amd64 .

      - name: Build (macOS arm64)
        run: GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-X barcode-rest/internal/server.Version=${GITHUB_REF_NAME}" -o barcode-rest-darwin-arm64 .

      - name: Generate checksums
        run: sha256sum barcode-rest.exe barcode-rest-linux-amd64 barcode-rest-linux-arm64 barcode-rest-darwin-amd64 barcode-rest-darwin-arm64 > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            barcode-rest.exe
            barcode-rest-linux-amd64
            barcode-rest-linux-arm64
            barcode-rest-darwin-amd64
            barcode-rest-darwin-arm64
            checksums.txt
